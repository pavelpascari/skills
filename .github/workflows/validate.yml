name: Validate plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      # Runs before `claude plugin validate`, which reports a version mismatch as a
      # warning and still exits 0 — CI stayed green through two releases while
      # marketplace.json and plugin.json drifted apart.
      - name: Check plugin versions are in sync
        run: bash scripts/check-version-sync.sh

      - name: Validate marketplace
        run: claude plugin validate .

      - name: Validate each plugin
        run: |
          for dir in plugins/*/; do
            echo "Validating $dir"
            claude plugin validate "$dir"
          done
